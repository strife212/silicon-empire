<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silicon Empire</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="scene-container"></div>
  <div id="boot"><pre id="boot-text"></pre></div>

  <header id="topbar">
    <div class="stat big"><span id="credits">0</span><label>credits</label></div>
    <div class="stat"><span id="cps">0/s</span><label>income</label></div>
    <div class="stat hidden" id="rp-stat"><span id="rp">0</span><label>research</label></div>
    <div class="stat hidden" id="power-stat"><span id="power">0/0</span><label>power kW</label></div>
    <div class="stat hidden" id="heat-stat"><span id="heat">0/0</span><label>heat</label></div>
    <div class="stat hidden" id="chips-stat"><span id="chips">0</span><label>vintage chips</label></div>
    <div class="spacer" id="ticker"></div>
    <button id="prestige-btn" class="hidden">⟲ Prestige</button>
    <button id="research-btn" class="hidden">🔬 Research</button>
    <button id="settings-btn">⚙</button>
  </header>

  <aside id="left-panel">
    <div id="era-title" class="glitch" data-text="LAYER 01 // GARAGE">LAYER 01 // GARAGE</div>
    <div id="qty-row">
      <span>Buy</span>
      <button class="qty active" data-qty="1">×1</button>
      <button class="qty" data-qty="10">×10</button>
      <button class="qty" data-qty="100">×100</button>
      <button class="qty" data-qty="max">Max</button>
    </div>
    <div id="tiers"></div>
    <div id="infra-panel" class="hidden">
      <div class="panel-head">Power &amp; Cooling</div>
      <div id="infra-list"></div>
      <div id="alloc-row" class="hidden">
        <label>Workload: <span id="alloc-label">100% credits</span></label>
        <input type="range" id="alloc" min="0" max="90" value="0" />
      </div>
      <label id="autobuy-row" class="hidden"><input type="checkbox" id="autobuy" /> Procurement AI (auto-buy)</label>
    </div>
  </aside>

  <aside id="research-panel" class="hidden">
    <div class="panel-head">Research <span id="rp-inline"></span><button id="research-close">✕</button></div>
    <div id="research-cols"></div>
  </aside>

  <div id="bottom-center">
    <button id="click-btn">▶ Run Job <span id="click-value"></span></button>
    <div id="job-offer" class="hidden"></div>
  </div>

  <div id="incident-banner" class="hidden">
    <span id="incident-text"></span>
    <button id="reboot-btn">Reboot</button>
  </div>

  <div id="toasts"></div>

  <div id="modal-overlay" class="hidden">
    <div id="modal"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
